[build-system]
requires = ["hatchling>=1.5.0", "jupyter-builder>=1.2.2"]
build-backend = "hatchling.build"

[project]
name = "jupyter_ai_pi_terminal"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
description = "The pi coding agent as a command in the JupyterLite terminal"
authors = [
    { name = "Jupyter Development Team", email = "jupyter@googlegroups.com" },
]
keywords = ["jupyter", "jupyterlab", "jupyterlite", "jupyterlab-extension"]
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
dependencies = [
    "jupyterlite-core >=0.8.6",
    "jupyterlite-terminal >=1.6.2,<2",
    "jupyter-ai-pi ==0.1.0",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/jupyter-ai-contrib/jupyter-ai-pi-lite#readme"
Repository = "https://github.com/jupyter-ai-contrib/jupyter-ai-pi-lite"
Source = "https://github.com/jupyter-ai-contrib/jupyter-ai-pi-lite/tree/main"
Issues = "https://github.com/jupyter-ai-contrib/jupyter-ai-pi-lite/issues/new/choose"

[tool.hatch.version]
path = "jupyter_ai_pi_terminal/_version.py"

[tool.hatch.build.targets.sdist]
artifacts = ["jupyter_ai_pi_terminal/labextension"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter_ai_pi_terminal/labextension" = "share/jupyter/labextensions/@jupyter-ai/pi-terminal"
"install.json" = "share/jupyter/labextensions/@jupyter-ai/pi-terminal/install.json"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyter_ai_pi_terminal/labextension/static/style.js",
    "jupyter_ai_pi_terminal/labextension/package.json",
]
skip-if-exists = ["jupyter_ai_pi_terminal/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]
path = "../.."

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
npm = ["jlpm"]
build_cmd = "build:prod"
editable_build_cmd = "build"
build_dir = "jupyter_ai_pi_terminal/labextension"
path = "../.."

[tool.check-wheel-contents]
ignore = ["W002"]
