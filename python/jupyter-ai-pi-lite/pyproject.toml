[build-system]
requires = ["hatchling>=1.5.0", "jupyter-builder>=1.2.2"]
build-backend = "hatchling.build"

[project]
name = "jupyter_ai_pi_lite"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
description = "The pi coding agent in JupyterLab and JupyterLite: a chat persona and a terminal command"
authors = [
    { name = "Jupyter Development Team", email = "jupyter@googlegroups.com" },
]
keywords = ["jupyter", "jupyterlab", "jupyterlite", "jupyterlab-extension", "pi"]
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
dependencies = [
    "jupyter-ai-agent-lite >=0.21.0,<0.22",
    "jupyter-ai-persona-manager >=0.3.0a0,<0.4",
    "jupyter-chat-components >=0.7.0,<0.8",
    "jupyter-mcp-manager >=0.2.0,<0.3",
    "jupyter-secrets-manager >=0.5,<0.6",
    "jupyterlab-chat >=0.25.2,<0.26",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/jupyter-ai-contrib/jupyter-ai-pi-lite#readme"
Repository = "https://github.com/jupyter-ai-contrib/jupyter-ai-pi-lite"
Source = "https://github.com/jupyter-ai-contrib/jupyter-ai-pi-lite/tree/main"
Issues = "https://github.com/jupyter-ai-contrib/jupyter-ai-pi-lite/issues/new/choose"

[tool.hatch.version]
path = "jupyter_ai_pi_lite/_version.py"

[tool.hatch.build.targets.sdist]
artifacts = ["jupyter_ai_pi_lite/labextension"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter_ai_pi_lite/labextension" = "share/jupyter/labextensions/@jupyter-ai/pi-lite"
"install.json" = "share/jupyter/labextensions/@jupyter-ai/pi-lite/install.json"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyter_ai_pi_lite/labextension/static/style.js",
    "jupyter_ai_pi_lite/labextension/package.json",
]
skip-if-exists = ["jupyter_ai_pi_lite/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]
path = "../.."

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
npm = ["jlpm"]
build_cmd = "build:prod"
editable_build_cmd = "build"
build_dir = "jupyter_ai_pi_lite/labextension"
path = "../.."

[tool.check-wheel-contents]
ignore = ["W002"]
